<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>まなび Test Maker</title><link rel="stylesheet" href="./src/style.css"></head>
<body class="locked"><header><div><strong>まなび Test Maker</strong><small>数学考査作成スタジオ · v0.2.0</small></div><nav><button id="newPage">ページ追加</button><button id="saveVersion">履歴保存</button><button id="backup">暗号化バックアップ</button><button id="lock">ロック</button><button id="restore">読込</button><button id="print" class="primary">PDF・印刷</button></nav></header>
<div class="notice">開発版：保管庫は端末内で暗号化。Drive自動同期は未接続です。実施前の考査への利用は学校の許可・安全性検証後にしてください。</div>
<main class="app"><aside><h2>問題保管庫</h2><input id="search" placeholder="単元・問題を検索" aria-label="問題検索"><div id="bank"></div><button id="newQuestion">＋ 自作問題を登録</button></aside>
<section id="stage" class="stage"><div class="stagebar"><input id="title" aria-label="考査タイトル"><span id="pageStatus"></span><button id="clear">試作を初期化</button></div><div id="pages"></div></section>
<aside class="right"><h2>出題情報</h2><div class="metric">問題数 <b id="count"></b></div><div class="metric">配点合計 <b id="points"></b></div><div class="metric">知識・技能 <b id="knowledge"></b></div><div class="metric">思考・判断・表現 <b id="thinking"></b></div><p id="warnings" class="warn"></p><h2>選択中の問題</h2><div id="inspector"></div><h2>編集履歴（端末内）</h2><div id="history"></div></aside></main><section id="gate" class="gate"><form id="gateForm" class="gate-card"><h1>まなび Test Maker</h1><p id="gateInfo">保管庫を読み込んでいます…</p><label for="pass">保管庫のパスフレーズ</label><input id="pass" type="password" autocomplete="current-password" required disabled><label id="confirmLabel" for="passConfirm" hidden>確認用パスフレーズ</label><input id="passConfirm" type="password" autocomplete="new-password" hidden><button id="unlock" class="primary" disabled>開く</button><p id="gateError" role="alert"></p><small>パスフレーズを忘れると復号できません。別端末での再開には暗号化バックアップとパスフレーズが必要です。</small></form></section><footer><span id="status"></span><span>A4・mm単位 / MathML・SVG</span></footer><input type="file" id="file" accept=".manabitest,.json,application/json" hidden><script type="module" src="./src/app.mjs"></script></body></html>
